<div class="container">
    <div class="row justify-content-center align-items-center min-vh-100">

        <div class="col-lg-4 col-md-6 col-sm-10">

            <div class="card shadow-lg border-0 rounded-4">

                <div class="card-body p-5">

                    <div class="text-center mb-4">
                        <i class="bi bi-person-circle display-3 text-primary"></i>
                        <h2 class="mt-3 fw-bold">Welcome Back</h2>
                        <p class="text-muted">
                            Sign in to continue
                        </p>
                    </div>

                    <form>
                         <div class="mb-3 red" #messageEle>
                            {{message}}
                         </div>
                        <!-- Email -->
                        <div class="mb-3">
                            <label class="form-label fw-semibold" for="userId">
                                Email Address
                            </label>

                            <div class="input-group">
                                <span class="input-group-text">
                                    <i class="bi bi-envelope"></i>
                                </span>

                                <input
                                    type="text"
                                    id="userId"
                                    
                                    #UserIdElement
                                    (input)="changeText()"
                                

                                    class="form-control"
                                    placeholder="Enter email/UserName">
                            </div>
                        </div>

                        <!-- Password -->
                        <div class="mb-3">
                            <label class="form-label fw-semibold">
                                Password
                            </label>

                            <div class="input-group">
                                <span class="input-group-text">
                                    <i class="bi bi-lock"></i>
                                </span>

                                <input
                                    type="password"
                                    id="passwordId"
                                     #passwordElement
                                    (input)="changeText()"
                                    class="form-control"
                                    placeholder="Enter password">

                                <button class="btn btn-outline-secondary" type="button">
                                    <i class="bi bi-eye"></i>
                                </button>
                            </div>
                        </div>

                        <!-- Remember -->
                        <div class="d-flex justify-content-between align-items-center mb-4">

                            <div class="form-check">
                                <input
                                    class="form-check-input"
                                    type="checkbox"
                                    id="remember">

                                <label class="form-check-label" for="remember">
                                    Remember Me
                                </label>
                            </div>

                            <a href="#" class="text-decoration-none">
                                Forgot Password?
                            </a>

                        </div>

                        <!-- Login Button -->
                        <div class="d-grid">
                            <button class="btn btn-primary btn-lg" (click) = "Submit(UserIdElement)" type="button">
                                <i class="bi bi-box-arrow-in-right me-2"></i>
                                Login
                            </button>
                        </div>

                    </form>

                    <hr class="my-4">

                    <div class="text-center">
                        <span class="text-muted">
                            Don't have an account?
                        </span>

                        <a href="#" class="text-decoration-none fw-semibold">
                            Register
                        </a>
                    </div>

                </div>

            </div>

        </div>

    </div>
</div>
